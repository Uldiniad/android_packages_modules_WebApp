<!DOCTYPE html>
<html>
<head>
    <title>Test PWA</title>
</head>
<body>
    Hello, I can run!
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service_worker.js')
                .then(reg => console.log('SW registered', reg))
                .catch(err => console.log('SW failed', err));
        }
    </script>
</body>
</html>
